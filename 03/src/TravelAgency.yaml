openapi: 3.0.3
info:
  title: Travel agency tours API
  description: |-
    An API for the tours of a travel agency
  version: 1.0.11
servers:
  - url: http://t-a.org
tags:
  - name: customers
    description: Access to travel agency customers
  - name: countries
    description: Countries the agency travels to
  - name: locations
    description: Places for potential tours
  - name: tours
    description: All about the travel tours 
    

paths:
  /customers:
    get:
      summary: Get list of customers
      tags: 
        - "customers"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad Request

    post:
      summary: Create a new customer
      tags: 
        - "customers"
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/Customer'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

        '400':
          description: Bad Request

  /customers/{customerId}:
    get:
      summary: Get a specific customer
      tags: 
        - "customers"
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad Request
        '404':
          description: Not Found

    put:
      summary: Update a specific customer
      tags: 
        - "customers"
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

        '400':
          description: Bad Request
        '404':
          description: Not Found

    delete:
      summary: Delete a specific customer
      tags: 
        - "customers"
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '404':
          description: Not Found

  /customers/{customerId}/tours:
    get:
      summary: Get list of tours for a specific customer
      tags: 
        - "customers"
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
             schema:
                $ref: '#/components/schemas/Customer'

        '400':
          description: Bad Request
        '404':
          description: Not Found


  /countries:
    get:
      summary: Get list of countries
      tags:
        - "countries"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'

        '400':
          description: Bad Request

    post:
      summary: Create a new country
      tags:
        - "countries"
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/Country'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'

        '400':
          description: Bad Request

  /countries/{countryId}:
    get:
      summary: Get a specific country
      tags:
        - "countries"
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'

        '400':
          description: Bad Request
        '404':
          description: Not Found

    put:
      summary: Update a specific country
      tags:
        - "countries"
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/Country'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'

        '400':
          description: Bad Request
        '404':
          description: Not Found

    delete:
      summary: Delete a specific country
      tags:
        - "countries"
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '404':
          description: Not Found

  /countries/{countryId}/locations:
    get:
      summary: Get list of locations for a specific country
      tags:
        - "countries"
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array  
                items:
                  $ref: '#/components/schemas/Location'

        '400':
          description: Bad Request
        '404':
          description: Not Found


  /locations:
    get:
      summary: Get list of locations
      tags:
        - "locations"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'

        '400':
          description: Bad Request

    post:
      summary: Create a new location
      tags:
        - "locations"
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Madrid
              countryId: 3
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          description: Bad Request

  /locations/{locationId}:
    get:
      summary: Get a specific location
      tags:
        - "locations"
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          description: Bad Request
        '404':
          description: Not Found
          

    put:
      summary: Update a specific location
      tags:
        - "locations"
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          description: Bad Request
        '404':
          description: Not Found

    delete:
      summary: Delete a specific location
      tags:
        - "locations"
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '404':
          description: Not Found

  /locations/{locationId}/tours:
    get:
      summary: Get list of tours for a specific location
      tags:
        - "locations"
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array  
                items:
                  $ref: '#/components/schemas/Tour'
                    

        '400':
          description: Bad Request
        '404':
          description: Not Found

  /tours:
    get:
      summary: Get list of tours
      tags:
        - "tours"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array  
                items:
                  $ref: '#/components/schemas/Tour'
        '400':
          description: Bad Request

    post:
      summary: Create a new tour
      tags:
        - "tours"
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/Tour'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
        '400':
          description: Bad Request

  /tours/{tourId}:
    get:
      summary: Get details of a specific tour
      tags:
        - "tours"
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'

        '400':
          description: Bad Request
        '404':
          description: Not Found

    put:
      summary: Update details of a specific tour
      tags:
        - "tours"
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/Tour'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
        '400':
          description: Bad Request
        '404':
          description: Not Found

    delete:
      summary: Delete a specific tour
      tags:
        - "tours"
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '404':
          description: Not Found
  
  
  
  
components:
  schemas:
    Country:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: Spain
        population:
          type: integer
          format: int64
          example: 47502258
        links:  
          type: object
          properties:
            self:
              type: string
              description: http://t-a.org/countries/1
              example: http://t-a.org/countries/1

    Tour:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 205
        destination:
          type: string
          example: Barcelona Exploration
        customers:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            name:
              type: string
              example: John Doe
        links:  
          type: object
          properties:
            self:
              type: string
              description: http://t-a.org/tours/1
              example: http://t-a.org/tours/1
    Location:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 104
        name:
          type: string
          example: Madrid
        country:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 3
            name:
              type: string
              example: Spain
        links:  
          type: object
          properties:
            self:
              type: string
              description: http://t-a.org/locations/1
              example: http://t-a.org/locations/1
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 100000
        username:
          type: string
          example: joeguy
        email:
          type: string
          format: email
          example: john.doe@example.com
        address:
          type: array
          xml:
            name: addresses
            wrapped: true
          items:
            $ref: '#/components/schemas/Address'
        links:  
          type: object
          properties:
            self:
              type: string
              description: http://t-a.org/customers/1
              example: http://t-a.org/customers/1
      xml:
        name: customer
    Address:
      type: object
      properties:
        street:
          type: string
          example: 697 Northern Ave
        city:
          type: string
          example: Los Angeles
        state:
          type: string
          example: CA
        zip:
          type: string
          example: '94301'
      xml:
        name: address
  securitySchemes:
    travelagency_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://t-a.org/oauth/authorize
          scopes:
            write:tours: modify tours 
            read:tours: read tours
            write:countries: modify countries 
            read:countries: read countries
            write:locations: modify locations 
            read:locations: read locations
    api_key:
      type: apiKey
      name: api_key
      in: header
